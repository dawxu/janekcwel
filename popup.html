<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <title>👀</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%; height:100%;
      background:#000;
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
    }
    body { animation: flash 0.08s ease-out; }
    @keyframes flash { from{background:#fff} to{background:#000} }
    #container {
      text-align:center;
      animation: zoom-in 0.15s cubic-bezier(0.175,0.885,0.32,1.275);
    }
    @keyframes zoom-in {
      from{transform:scale(0.3);opacity:0}
      to{transform:scale(1);opacity:1}
    }
    img {
      width:100%; max-width:320px; height:auto;
      display:block; margin:0 auto;
      animation: glitch 0.08s infinite;
      border:4px solid #ff0000;
    }
    @keyframes glitch {
      0%  { transform:translate(0,0) skewX(0deg); filter:hue-rotate(0deg); }
      15% { transform:translate(-3px,1px) skewX(2deg); filter:hue-rotate(90deg); }
      30% { transform:translate(3px,-1px) skewX(-1deg); filter:hue-rotate(180deg); }
      50% { transform:translate(-4px,2px) skewX(3deg); filter:hue-rotate(270deg); }
      70% { transform:translate(4px,-2px) skewX(-2deg); filter:hue-rotate(45deg); }
      100%{ transform:translate(0,0) skewX(0deg); filter:hue-rotate(0deg); }
    }
    #txt {
      color:#ff0000; font-size:18px; font-weight:bold;
      font-family:monospace; letter-spacing:0.05em;
      margin-top:8px;
      animation: blink 0.15s infinite;
      text-shadow: 2px 0 #00ffff, -2px 0 #ff00ff;
    }
    @keyframes blink {
      0%,49%{opacity:1} 50%,100%{opacity:0}
    }
  </style>
</head>
<body>
  <div id="container">
    <img src="togif.gif" alt="👀"/>
    <div id="txt">BŁĄD KRYTYCZNY — 0x0000DEAD</div>
  </div>

  <script>
  // --- RUCH OKIENKA ---
  const W = window.outerWidth  || 380;
  const H = window.outerHeight || 300;
  const SW = screen.width;
  const SH = screen.height;

  let x = window.screenX || Math.random() * (SW - W);
  let y = window.screenY || Math.random() * (SH - H);

  // losowa prędkość i kierunek dla każdego okna
  let vx = (3 + Math.random() * 5) * (Math.random() < 0.5 ? 1 : -1);
  let vy = (3 + Math.random() * 5) * (Math.random() < 0.5 ? 1 : -1);

  function moveWindow() {
    x += vx;
    y += vy;

    // odbijanie od krawędzi ekranu
    if (x <= 0)       { x = 0;      vx = Math.abs(vx); }
    if (x >= SW - W)  { x = SW - W; vx = -Math.abs(vx); }
    if (y <= 0)       { y = 0;      vy = Math.abs(vy); }
    if (y >= SH - H)  { y = SH - H; vy = -Math.abs(vy); }

    try { window.moveTo(Math.round(x), Math.round(y)); } catch(e){}
  }

  // 60fps ruch
  setInterval(moveWindow, 16);

  // co jakiś czas zmień prędkość żeby było chaotyczniej
  setInterval(() => {
    vx += (Math.random() - 0.5) * 3;
    vy += (Math.random() - 0.5) * 3;
    // clamp żeby nie było za wolno ani za szybko
    vx = Math.sign(vx) * Math.min(Math.max(Math.abs(vx), 2), 12);
    vy = Math.sign(vy) * Math.min(Math.max(Math.abs(vy), 2), 12);
  }, 800);

  // --- DŹWIĘK UMIERAJĄCEGO KOMPUTERA ---
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let t = ctx.currentTime + 0.05;

    function beep(freq, start, dur, vol) {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      const dist = ctx.createWaveShaper();
      const curve = new Float32Array(256);
      for(let i=0;i<256;i++){const x=(i*2)/256-1;curve[i]=((Math.PI+200)*x)/(Math.PI+200*Math.abs(x));}
      dist.curve = curve;
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(vol, start + 0.005);
      gain.gain.setValueAtTime(vol, start + dur - 0.008);
      gain.gain.linearRampToValueAtTime(0, start + dur);
      osc.connect(dist); dist.connect(gain); gain.connect(ctx.destination);
      osc.start(start); osc.stop(start + dur + 0.01);
    }

    function noise(start, dur, vol) {
      const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1)*0.3;
      const src  = ctx.createBufferSource();
      const gain = ctx.createGain();
      const filt = ctx.createBiquadFilter();
      filt.type = 'bandpass';
      filt.frequency.value = 3000 + Math.random()*2000;
      filt.Q.value = 8;
      src.buffer = buf;
      gain.gain.setValueAtTime(vol, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
      src.connect(filt); filt.connect(gain); gain.connect(ctx.destination);
      src.start(start); src.stop(start + dur);
    }

    beep(1760, t,       0.9,  0.4);
    beep(1760, t+1.05,  0.9,  0.4);
    beep(1760, t+2.2,   0.12, 0.5);
    beep(1760, t+2.38,  0.12, 0.5);
    beep(1760, t+2.56,  0.12, 0.5);
    noise(t+2.8, 0.15, 0.6);
    beep(880,   t+2.82, 0.08, 0.3);
    noise(t+3.0, 0.08, 0.4);

    function annoyingLoop() {
      let lt = ctx.currentTime;
      const patterns = [
        () => {
          const osc = ctx.createOscillator();
          const lfo = ctx.createOscillator();
          const lfoGain = ctx.createGain();
          const gain = ctx.createGain();
          osc.type = 'square';
          osc.frequency.value = 2200 + Math.random()*400;
          lfo.type = 'sine';
          lfo.frequency.value = 8 + Math.random()*12;
          lfoGain.gain.value = 80;
          lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
          gain.gain.setValueAtTime(0.35, lt);
          gain.gain.linearRampToValueAtTime(0, lt + 0.6);
          osc.connect(gain); gain.connect(ctx.destination);
          lfo.start(lt); osc.start(lt);
          lfo.stop(lt+0.65); osc.stop(lt+0.65);
        },
        () => { for(let i=0;i<5;i++) beep(1200+Math.random()*1200, lt+i*0.08, 0.06, 0.4); },
        () => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(3000, lt);
          osc.frequency.exponentialRampToValueAtTime(200, lt+0.5);
          gain.gain.setValueAtTime(0.3, lt);
          gain.gain.exponentialRampToValueAtTime(0.001, lt+0.55);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(lt); osc.stop(lt+0.6);
        },
        () => { noise(lt, 0.2, 0.5); noise(lt+0.25, 0.15, 0.4); },
      ];
      patterns[Math.floor(Math.random()*patterns.length)]();
    }

    setTimeout(() => {
      annoyingLoop();
      setInterval(annoyingLoop, 500 + Math.random()*300);
    }, 3600);

  } catch(e){}
  </script>
</body>
</html>

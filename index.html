<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Słodki chomiczek 🐹</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#1a0010;
      display:flex; align-items:center; justify-content:center;
      min-height:100vh; font-family:monospace;
      overflow:hidden;
    }
    #scene {
      width:100vw; min-height:100vh;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      position:relative; overflow:hidden;
    }
    #vignette {
      position:absolute; inset:0;
      background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
      pointer-events:none;
    }
    #particles { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
    .spark {
      position:absolute; width:2px; height:2px;
      background:#ff66cc; border-radius:50%;
      animation:spark-fall linear forwards;
    }
    @keyframes spark-fall {
      from{transform:translateY(-10px);opacity:1}
      to{transform:translateY(110vh);opacity:0}
    }
    #title {
      color:#ffaadd; font-size:22px;
      letter-spacing:0.08em; text-align:center;
      margin-bottom:1.5rem;
      animation:flicker 4s infinite;
      text-shadow: 0 0 20px #ff44aa;
      padding: 0 1rem;
    }
    @keyframes flicker {
      0%,100%{opacity:1} 50%{opacity:0.8} 87%{opacity:0.6} 89%{opacity:1}
    }
    #hamster-wrap {
      position:relative; cursor:pointer;
      transition: transform 0.1s;
    }
    #hamster-wrap:hover { transform: scale(1.05); }
    #hamster-wrap:active { transform: scale(0.95); }
    #hamster {
      width:260px; height:260px;
      border-radius:50%; object-fit:cover;
      border:4px solid #ff88cc;
      box-shadow: 0 0 30px #ff44aa, 0 0 60px #aa0044;
      display:block;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%,100%{transform:translateY(0px)} 50%{transform:translateY(-10px)}
    }
    #click-hint {
      color:#aa4466; font-size:12px;
      letter-spacing:0.15em; text-transform:uppercase;
      margin-top:1rem;
      animation: pulse-hint 1.5s ease-in-out infinite;
    }
    @keyframes pulse-hint {
      0%,100%{opacity:0.4} 50%{opacity:1}
    }
    #click-count {
      position:fixed; bottom:18px; right:22px;
      font-size:12px; color:#440022; letter-spacing:0.1em;
    }
    #scare-overlay {
      display:none; position:fixed; inset:0;
      background:#fff;
      align-items:center; justify-content:center;
      animation:flash-in 0.06s ease-out; z-index:100;
    }
    @keyframes flash-in { from{opacity:0} to{opacity:1} }
    #scare-face { font-size:160px; animation:scare-bounce 0.15s infinite alternate; line-height:1; }
    @keyframes scare-bounce {
      from{transform:scale(1) rotate(-3deg)} to{transform:scale(1.08) rotate(3deg)}
    }
    #popup-hint {
      margin-top:1.2rem; font-size:11px; color:#660033;
      letter-spacing:0.08em; text-transform:uppercase;
      opacity:0; transition:opacity 1s; text-align:center; padding:0 2rem;
    }
  </style>
</head>
<body>
<div id="scene">
  <div id="vignette"></div>
  <div id="particles"></div>
  <p id="title">Dotknij tego słodkiego chomiczka 🐹</p>
  <div id="hamster-wrap">
    <img id="hamster" src="togif.gif" alt="chomiczek"/>
  </div>
  <p id="click-hint">kliknij mnie!</p>
  <p id="popup-hint">zezwól na okienka popup żeby zobaczyć pełny efekt 😈</p>
  <span id="click-count"></span>
  <div id="scare-overlay">
    <div id="scare-face">💀</div>
  </div>
</div>
<audio id="mem-audio" src="dzwiekmem.mp3" loop preload="auto"></audio>

<script>
const hamsterWrap = document.getElementById('hamster-wrap');
const overlay     = document.getElementById('scare-overlay');
const clickCount  = document.getElementById('click-count');
const popupHint   = document.getElementById('popup-hint');
const clickHint   = document.getElementById('click-hint');
const title       = document.getElementById('title');
const audio       = document.getElementById('mem-audio');

const POPUP_COUNT = 1000;
let clicks = 0, scared = false;

const buildupTitles = [
  'Dotknij tego słodkiego chomiczka 🐹',
  'Och, jaki słodki chomiczek... 🐹',
  'Serio, kliknij jeszcze raz 🐹',
  'Ostatni raz, obiecuję... 😇',
  'Za. Późno. 😈'
];

function spawnSparks() {
  const c = document.getElementById('particles');
  for(let i=0;i<16;i++){
    const s=document.createElement('div'); s.className='spark';
    s.style.left=(Math.random()*100)+'%';
    s.style.animationDuration=(0.8+Math.random()*1.4)+'s';
    s.style.animationDelay=(Math.random()*0.3)+'s';
    s.style.width=s.style.height=(1+Math.random()*3)+'px';
    c.appendChild(s); setTimeout(()=>s.remove(),2200);
  }
}

function playMemSound() {
  try {
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const source = actx.createMediaElementSource(audio);
    const gainNode = actx.createGain();
    gainNode.gain.value = 6;
    source.connect(gainNode);
    gainNode.connect(actx.destination);
    audio.volume = 1.0;
    audio.play().catch(()=>{});
  } catch(e) {
    audio.volume = 1.0;
    audio.play().catch(()=>{});
  }
}

function openPopups() {
  // otwieraj bardzo szybko — co 30ms, przeglądarka zablokuje co może ale kilkadziesiąt wejdzie
  for(let i=0; i<POPUP_COUNT; i++){
    const w=380+Math.floor(Math.random()*80);
    const h=280+Math.floor(Math.random()*80);
    const left=Math.floor(Math.random()*Math.max(100,screen.width-w));
    const top=Math.floor(Math.random()*Math.max(100,screen.height-h));
    setTimeout(()=>{
      window.open(
        'popup.html','scare_'+i,
        `width=${w},height=${h},left=${left},top=${top},resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,status=no`
      );
    }, i*30);
  }
  setTimeout(()=>{ popupHint.style.opacity='1'; }, 800);
}

hamsterWrap.addEventListener('click', () => {
  if(scared) return;
  clicks++;
  spawnSparks();

  hamsterWrap.classList.remove('clicked');
  void hamsterWrap.offsetWidth;

  title.textContent = buildupTitles[Math.min(clicks-1, buildupTitles.length-1)];
  clickCount.textContent = clicks > 1 ? `×${clicks}` : '';

  if(clicks >= 5){
    scared = true;
    clickHint.style.opacity = '0';
    playMemSound();

    setTimeout(()=>{
      overlay.style.display = 'flex';
      openPopups(); // od razu 1000 okien!
      setTimeout(()=>{
        overlay.style.display = 'none';
        setTimeout(()=>{
          scared=false; clicks=0;
          title.textContent=buildupTitles[0];
          clickCount.textContent='';
          clickHint.style.opacity='1';
          spawnSparks();
        },3000);
      },1500);
    },80);
  }
});
</script>
</body>
</html>
